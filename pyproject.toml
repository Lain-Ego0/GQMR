[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "gqmr"
version = "0.0.1"
description = "General Quadruped Motion Retargeting"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "GQMR contributors" }]
dependencies = [
  "av>=16,<17",
  "numpy>=2.5,<2.6",
  "platformdirs>=4.4,<5",
  "mujoco>=3.11,<3.12",
  "pydantic>=2.11,<3",
  "PySide6>=6.11,<6.12",
  "PyYAML>=6.0.2,<7",
  "pyzmq>=27,<28",
  "scipy>=1.18,<1.19",
]

[project.optional-dependencies]
test = [
  "hypothesis>=6.138,<7",
  "pytest>=8.4,<9",
]

[project.scripts]
gqmr = "gqmr.cli.main:main"
gqmr-gui = "gqmr.ui.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gqmr"]
exclude = [
  "motion_imitation/**",
]

[tool.hatch.build.targets.sdist]
exclude = [
  "/motion_imitation",
  "/.deps",
  "/.venv",
  "/dist",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
