[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "gqmr-dog-mmpose"
version = "0.1.0"
description = "Optional MMPose animal-video backend for GQMR"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["gqmr>=0.0.1"]

[project.entry-points."gqmr.pose_backends"]
dog-mmpose = "gqmr_dog_mmpose.backend:MMPoseDogBackend"

[tool.hatch.build.targets.wheel]
packages = ["src/gqmr_dog_mmpose"]
