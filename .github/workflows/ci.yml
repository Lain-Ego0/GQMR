name: CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
      MUJOCO_GL: egl
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.3"
          enable-cache: true
      - run: uv sync --frozen --extra test
      - run: uv run python -m compileall -q src
      - run: uv run pytest -q
      - run: uv build
      - name: Verify restricted historical data is absent
        run: |
          uv run python - <<'PY'
          import pathlib, zipfile
          for wheel in pathlib.Path("dist").glob("*.whl"):
              with zipfile.ZipFile(wheel) as archive:
                  names = archive.namelist()
                  assert not any("motion_imitation" in name for name in names)
                  assert not any(name.endswith("_joint_pos.txt") for name in names)
          PY
